{% macro marketing_nav(active='') %}
<div class="marketing-nav">
    <a href="{{ url_for('index') }}" class="marketing-brand">Airbud</a>
    <div class="marketing-nav-links">
        <a href="{{ url_for('about') }}"{% if active == 'about' %} class="active"{% endif %}>About</a>
        <a href="{{ url_for('faq') }}"{% if active == 'faq' %} class="active"{% endif %}>FAQ</a>
        <a href="{{ url_for('pricing') }}"{% if active == 'pricing' %} class="active"{% endif %}>Pricing</a>
        {% if active != 'login' %}
        <a href="{{ url_for('admin_login') }}">Sign In</a>
        {% endif %}
        {% if active != 'signup' %}
        <a href="{{ url_for('signup') }}" class="btn btn-primary btn-small">Get Started</a>
        {% endif %}
    </div>
</div>
{% endmacro %}
