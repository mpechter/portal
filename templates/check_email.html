{% extends "base.html" %}

{% block title %}Check Your Email - Portal{% endblock %}

{% block content %}
<div class="card centered">
    <h1>Check Your Email</h1>
    <p>We've sent a login link to <strong>{{ email }}</strong>.</p>
    <p>Click the link in the email to access {{ org_name }}.</p>
    <p class="text-muted">The link expires in 15 minutes.</p>
    <p class="text-muted"><a href="{{ url_for('login') }}">Didn't receive it? Try again</a></p>
</div>
{% endblock %}
