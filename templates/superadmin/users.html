{% extends "base.html" %}

{% block title %}Users — Internal Dashboard{% endblock %}

{% block content %}
<div class="admin-dashboard">
    <div class="admin-header">
        <h1>Users</h1>
        <a href="{{ url_for('superadmin_logout') }}" class="admin-logout">Logout</a>
    </div>

    <div style="overflow-x: auto;">
        <table style="width: 100%; border-collapse: collapse; font-size: 14px;">
            <thead>
                <tr style="border-bottom: 2px solid #e0e0e0; text-align: left;">
                    <th style="padding: 10px 12px; color: #555; font-weight: 600;">Name</th>
                    <th style="padding: 10px 12px; color: #555; font-weight: 600;">Org Code</th>
                    <th style="padding: 10px 12px; color: #555; font-weight: 600;">Email</th>
                    <th style="padding: 10px 12px; color: #555; font-weight: 600;">Plan</th>
                </tr>
            </thead>
            <tbody>
                {% for org in orgs %}
                <tr style="border-bottom: 1px solid #f0f0f0;">
                    <td style="padding: 10px 12px; font-weight: 500;">{{ org.name }}</td>
                    <td style="padding: 10px 12px;">
                        <code style="background: #f5f5f5; padding: 2px 6px; border-radius: 4px; font-size: 12px;">{{ org.org_code }}</code>
                    </td>
                    <td style="padding: 10px 12px; color: #444;">{{ org.admin_email or '—' }}</td>
                    <td style="padding: 10px 12px;">{{ org.plan or '—' }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
