{% extends "base.html" %}

{% block title %}Forgot Password - Admin{% endblock %}

{% block content %}
<a href="{{ url_for('admin_login') }}" class="back-link">← Back to Admin Login</a>
<div class="card centered">
    <h1>Reset Admin Password</h1>
    <p>Enter your organization code and we'll send a reset link to the admin email on file.</p>
    <form action="{{ url_for('admin_forgot_password') }}" method="post" class="form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="org_code">Organization Code</label>
            <input type="text" id="org_code" name="org_code" value="{{ org_code }}"
                   placeholder="e.g., SCHOOL1" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Send Reset Link</button>
    </form>
    <p class="text-muted" style="margin-top: 20px;">
        Don't have an admin email on file? Contact support.
    </p>
</div>
{% endblock %}
