{% extends "base.html" %}

{% block title %}Reset Password - Admin{% endblock %}

{% block content %}
<div class="card centered" style="max-width: 420px;">
    <h1>Set New Password</h1>
    <p>Enter a new admin password for <strong>{{ org.org_code }}</strong>.</p>
    <form action="{{ url_for('admin_reset_password', token=token) }}" method="post" class="form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="password">New Password</label>
            <input type="password" id="password" name="password"
                   placeholder="At least 6 characters" required autofocus>
        </div>
        <div class="form-group">
            <label for="password_confirm">Confirm Password</label>
            <input type="password" id="password_confirm" name="password_confirm"
                   placeholder="Re-enter password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Reset Password</button>
    </form>
</div>
{% endblock %}
