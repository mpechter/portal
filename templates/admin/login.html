{% extends "base.html" %}

{% block title %}Admin Login — Airbud{% endblock %}

{% block content %}
<div class="card centered">
<h1>Admin Login</h1>
    <p>Enter your organization code and admin password.</p>
    <form action="{{ url_for('admin_login') }}" method="post" class="form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="org_code">Organization Code</label>
            <input type="text" id="org_code" name="org_code" value="{{ org_code }}" placeholder="e.g., SCHOOL1" required>
        </div>
        <div class="form-group">
            <label for="password">Admin Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div style="text-align: center;">
            <button type="submit" id="login-btn" class="btn btn-primary">Log In</button>
        </div>
    </form>
    <p class="text-muted" style="margin-top: 20px;">
        <a href="{{ url_for('admin_forgot_password', org=org_code) if org_code else url_for('admin_forgot_password') }}">
            Forgot password?
        </a>
    </p>
    <p class="text-muted" style="margin-top: 10px;">
        Don't have an account? <a href="{{ url_for('signup') }}">Get started</a>
    </p>
</div>
<script>
(function() {
    var form = document.querySelector('form');
    var btn = document.getElementById('login-btn');
    if (!form || !btn) return;
    form.addEventListener('submit', function() {
        btn.disabled = true;
        btn.textContent = 'Logging in…';
    });
})();
</script>
{% endblock %}
