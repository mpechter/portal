{% extends "base.html" %}

{% block title %}Welcome - Portal{% endblock %}

{% block content %}
<a href="{{ url_for('admin_login') }}" class="corner-link">Admin Login</a>
<div class="card centered">
    <h1>Welcome</h1>
    <p>Enter your organization code to get started.</p>
    <form action="{{ url_for('login') }}" method="get" class="form">
        <div class="form-group">
            <label for="org">Organization Code</label>
            <input type="text" id="org" name="org" placeholder="e.g., SCHOOL1" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary">Continue</button>
    </form>
</div>
{% endblock %}
