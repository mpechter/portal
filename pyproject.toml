[project]
name = "portal"
version = "0.1.0"
description = "Self-service portal for editing Airtable records"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-login>=0.6.3",
    "pyairtable>=2.3.3",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.9",
    "gunicorn>=21.0.0",
    "resend>=2.0.0",
    "stripe>=14.4.1",
]

[project.scripts]
portal = "app:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-flask>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
